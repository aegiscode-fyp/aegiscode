name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  build-and-test:
    name: build-and-test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 26]
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build all packages (Turborepo)
        run: npm run build

      - name: Type-check all packages
        run: npm run typecheck

      - name: Run tests
        run: npm test

  rule-tests:
    name: rule-tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Test AegisCode Semgrep rules (offline, in Docker)
        run: node packages/engine-sast/scripts/test-rules.mjs
