# AegisCode SAST rules: path traversal (CWE-22).
# The DAST engine probes path traversal too, so these findings can be correlated with DAST (FR-08).
# Top-level x-* keys are shared YAML anchors used by the rules below; Semgrep ignores them.
# The request-source anchors are identical in every taint rule file: change them everywhere at once.

x-request-source: &request-source
  patterns:
    - pattern-inside: function ... ($REQ, ...) {...}
    - metavariable-regex:
        metavariable: $REQ
        regex: (?i)^_?req(uest)?$
    - pattern-either:
        - pattern: $REQ.query
        - pattern: $REQ.body
        - pattern: $REQ.params
        - pattern: $REQ.cookies
        - pattern: $REQ.signedCookies
        - pattern: $REQ.headers
        - pattern: $REQ.get(...)
        - pattern: $REQ.header(...)
        - pattern: $REQ.originalUrl
        - pattern: $REQ.url

x-koa-source: &koa-source
  patterns:
    - pattern-either:
        - pattern: $CTX.request.body
        - pattern: $CTX.request.query
        - pattern: $CTX.query
        - pattern: $CTX.params
    - metavariable-regex:
        metavariable: $CTX
        regex: ^ctx$

x-nest-source: &nest-source
  patterns:
    - pattern-either:
        - pattern-inside: |
            $M(..., @$D(...) $P: $T, ...) {...}
        - pattern-inside: |
            $M(..., @$D(...) $P, ...) {...}
    - metavariable-regex:
        metavariable: $D
        regex: ^(Body|Query|Param|Headers|Req|Request)$
    - focus-metavariable: $P

x-number-sanitizer: &number-sanitizer
  pattern-either:
    - pattern: parseInt(...)
    - pattern: parseFloat(...)
    - pattern: Number(...)
    - pattern: Number.parseInt(...)
    - pattern: Number.parseFloat(...)
    - pattern: Boolean(...)

x-filename-sanitizer: &filename-sanitizer
  pattern-either:
    - pattern: $PATH.basename(...)
    - pattern: basename(...)
    - patterns:
        - pattern: $F(...)
        - metavariable-regex:
            metavariable: $F
            regex: (?i)^(sanitize\w*|\w*sanitize)$

x-path-owasp: &path-owasp ["A01:2021 - Broken Access Control", "A01:2025 - Broken Access Control"]

rules:
  - id: aegiscode.javascript.path-traversal.tainted-fs-path
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      A file path built from request input is opened, written or deleted with the fs
      module. With "../" sequences (or an absolute path) an attacker can reach any
      file the server can, e.g. /etc/passwd or .env. Resolve the path against a base
      folder and reject it unless it still starts with that folder, or use
      path.basename() for plain file names.
    metadata:
      vulnerability_type: path-traversal
      cwe: "CWE-22"
      owasp: *path-owasp
      aegiscode_severity: high
      confidence: high
    mode: taint
    pattern-sources: [*request-source, *koa-source, *nest-source]
    pattern-sanitizers: [*number-sanitizer, *filename-sanitizer]
    pattern-sinks:
      - patterns:
          - pattern: $FS.$METHOD($FILE, ...)
          - metavariable-regex:
              metavariable: $FS
              regex: (?i)^(.*\.)?(fs|fsp|fse|fsextra|fspromises|promises|filesystem)$
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(readFile|readFileSync|writeFile|writeFileSync|appendFile|appendFileSync|createReadStream|createWriteStream|open|openSync|unlink|unlinkSync|rm|rmSync|rmdir|rmdirSync|readdir|readdirSync|copyFile|copyFileSync|rename|renameSync|stat|statSync|lstat|lstatSync|access|accessSync|exists|existsSync|truncate|truncateSync|readJson|readJsonSync|writeJson|writeJsonSync|outputFile|outputFileSync|remove|removeSync|copy|copySync|move|moveSync)$
          - focus-metavariable: $FILE

  - id: aegiscode.javascript.path-traversal.tainted-send-file
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      res.sendFile() / res.download() is given a path built from request input without
      the `root` option. An attacker can use "../" to download any file the server can
      read. Pass the file name with { root: BASE_DIR } (Express then rejects "..") and
      allow only expected file names.
    metadata:
      vulnerability_type: path-traversal
      cwe: "CWE-22"
      owasp: *path-owasp
      aegiscode_severity: high
      confidence: high
    mode: taint
    pattern-sources: [*request-source, *koa-source, *nest-source]
    pattern-sanitizers: [*number-sanitizer, *filename-sanitizer]
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $RES.sendFile($FILE, ...)
              - pattern: $RES.sendfile($FILE, ...)
              - pattern: $RES.download($FILE, ...)
          - pattern-not: '$RES.sendFile($FILE, {..., root: $ROOT, ...}, ...)'
          - pattern-not: '$RES.download($FILE, {..., root: $ROOT, ...}, ...)'
          - pattern-not: '$RES.download($FILE, $NAME, {..., root: $ROOT, ...}, ...)'
          - metavariable-regex:
              metavariable: $RES
              regex: (?i)^_?res(ponse)?$
          - focus-metavariable: $FILE

  - id: aegiscode.javascript.path-traversal.zip-slip
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      A file name taken from an archive entry is joined to the output folder without
      checking the result ("Zip Slip"). An entry named "../../app.js" is written
      outside the folder and can overwrite code. Resolve the target path and skip
      the entry unless it starts with the resolved output folder.
    metadata:
      vulnerability_type: path-traversal
      cwe: "CWE-22"
      owasp: *path-owasp
      aegiscode_severity: medium
      confidence: medium
    patterns:
      - pattern-either:
          - pattern: $PATH.$JOIN($DIR, $ENTRY.entryName)
          - pattern: $PATH.$JOIN($DIR, $ENTRY.fileName)
          - patterns:
              - pattern-either:
                  - pattern: $PATH.$JOIN($DIR, $ENTRY.path)
                  - pattern: $PATH.$JOIN($DIR, $ENTRY.name)
              - metavariable-regex:
                  metavariable: $ENTRY
                  regex: (?i)^(entry|zipentry|header|file)$
      - metavariable-regex:
          metavariable: $JOIN
          regex: ^(join|resolve)$
      - pattern-not-inside: |
          $DEST = $PATH.$JOIN($DIR, $NAME);
          ...
          if (<... $DEST.startsWith(...) ...>) $STMT;
      - pattern-not-inside: |
          $DEST = $PATH.$JOIN($DIR, $NAME);
          ...
          if (<... $DEST.startsWith(...) ...>) { ... }
      - pattern-not-inside: |
          $DEST = $PATH.$JOIN($DIR, $NAME);
          ...
          if (<... $P.relative($BASE, $DEST).startsWith(...) ...>) $STMT;
