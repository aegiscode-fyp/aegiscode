# AegisCode SAST rules: hardcoded secrets (CWE-798).
# Messages must never interpolate the secret ($VALUE, $KEY, ...): findings leave the machine (FR-10).
# The token-format rules are generic text rules so they also cover JSON and YAML config files.

x-secret-paths: &secret-paths
  include:
    - "*.js"
    - "*.jsx"
    - "*.mjs"
    - "*.cjs"
    - "*.ts"
    - "*.tsx"
    - "*.json"
    - "*.yml"
    - "*.yaml"
  exclude:
    - "package-lock.json"
    - "*.min.js"

rules:
  - id: aegiscode.javascript.hardcoded-secret.credential-assignment
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      A password, API key or token is written directly in the source code. Anyone who
      can read the repository or the built bundle gets it. Load it from an environment
      variable or a secrets manager (e.g. process.env.DB_PASSWORD) and rotate the
      exposed value.
    metadata:
      vulnerability_type: hardcoded-secret
      cwe: "CWE-798"
      owasp: ["A07:2021 - Identification and Authentication Failures", "A07:2025 - Authentication Failures"]
      aegiscode_severity: high
      confidence: medium
    patterns:
      - pattern-either:
          - pattern: $NAME = "$VALUE"
          - pattern: $OBJ.$NAME = "$VALUE"
          - pattern: '{..., $NAME: "$VALUE", ...}'
          - pattern: $NAME = $ENV || "$VALUE"
          - pattern: $NAME = $ENV ?? "$VALUE"
          - pattern: '{..., $NAME: $ENV || "$VALUE", ...}'
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i)^["']?(?!.*(header|field|label|name|url|uri|path|placeholder|regex|pattern|length|len|type|prompt|message|msg|error|route|param|input|selector|policy|hint|min|max|env|id|column|attr|format|algorithm|hash)["']?$).*(passw(or)?d|passwd|pwd|secret|api_?key|access_?key|auth_?token|access_?token|refresh_?token|bearer|private_?key|client_?secret|credential).*$
      - metavariable-regex:
          metavariable: $VALUE
          regex: ^(?!(?i:.*(changeme|change_me|your[_\- ]|example|placeholder|dummy|sample|xxxx|<|\$\{|\{\{|todo|redacted|\*\*\*)))(?![A-Z0-9_]+$)\S{8,}$
      - focus-metavariable: $VALUE

  - id: aegiscode.javascript.hardcoded-secret.jwt-literal-key
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      JSON Web Tokens are signed or verified with a key written in the source code.
      Anyone who sees the code can forge valid tokens and log in as any user. Load the
      key from the environment (process.env.JWT_SECRET) and use a long random value.
    metadata:
      vulnerability_type: hardcoded-secret
      cwe: "CWE-798"
      owasp: ["A07:2021 - Identification and Authentication Failures", "A07:2025 - Authentication Failures"]
      aegiscode_severity: critical
      confidence: high
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: $JWT.sign($PAYLOAD, "$KEY", ...)
              - pattern: $JWT.verify($TOKEN, "$KEY", ...)
              - pattern: $JWT.sign($PAYLOAD, $ENV || "$KEY", ...)
              - pattern: $JWT.verify($TOKEN, $ENV || "$KEY", ...)
          - metavariable-regex:
              metavariable: $JWT
              regex: (?i)^(jwt|jsonwebtoken|jwtlib)$
      - patterns:
          - pattern: '$EJWT({..., secret: "$KEY", ...})'
          - metavariable-regex:
              metavariable: $EJWT
              regex: (?i)^(jwt|expressjwt|express_jwt)$
      - pattern: '{..., secretOrKey: "$KEY", ...}'

  - id: aegiscode.javascript.hardcoded-secret.session-literal-secret
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      The session or cookie-signing secret is written in the source code. Anyone who
      sees it can forge session cookies and take over accounts. Load it from the
      environment (process.env.SESSION_SECRET) and use a long random value.
    metadata:
      vulnerability_type: hardcoded-secret
      cwe: "CWE-798"
      owasp: ["A07:2021 - Identification and Authentication Failures", "A07:2025 - Authentication Failures"]
      aegiscode_severity: high
      confidence: high
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: '$SESSION({..., secret: "$S", ...})'
              - pattern: '$SESSION({..., secret: $ENV || "$S", ...})'
              - pattern: '$SESSION({..., secret: ["$S", ...], ...})'
              - pattern: '$SESSION({..., keys: ["$S", ...], ...})'
          - metavariable-regex:
              metavariable: $SESSION
              regex: (?i)^(session|expresssession|cookiesession)$
      - pattern: cookieParser("$S", ...)
      - pattern: '$APP.register($PLUGIN, {..., secret: "$S", ...})'

  - id: aegiscode.javascript.hardcoded-secret.connection-string-password
    languages: [generic]
    severity: ERROR
    message: >-
      A database or message-broker connection URL contains a password. Anyone who can
      read this file can connect to the service. Build the URL from environment
      variables, or read the whole URL from one (process.env.DATABASE_URL).
    metadata:
      vulnerability_type: hardcoded-secret
      cwe: "CWE-798"
      owasp: ["A07:2021 - Identification and Authentication Failures", "A07:2025 - Authentication Failures"]
      aegiscode_severity: high
      confidence: high
    paths: *secret-paths
    patterns:
      - pattern-regex: (?i)\b(mongodb(\+srv)?|postgres(ql)?|mysql|mariadb|mssql|sqlserver|redis|rediss|amqps?)://[^:/\s"'`@]+:[^@/\s"'`]+@
      - pattern-not-regex: (?i)://[^:/\s"'`@]+:(\$\{|<|\{\{|%|\*+@|x{3,}|password@|pass@|passwd@|pwd@|changeme@|secret@)

  - id: aegiscode.javascript.hardcoded-secret.aws-access-key
    languages: [generic]
    severity: ERROR
    message: >-
      An AWS access key ID is written in this file. With its secret key it gives access
      to your AWS account. Remove it, deactivate the key in IAM, and use IAM roles or
      environment credentials instead.
    metadata:
      vulnerability_type: hardcoded-secret
      cwe: "CWE-798"
      owasp: ["A07:2021 - Identification and Authentication Failures", "A07:2025 - Authentication Failures"]
      aegiscode_severity: critical
      confidence: high
    paths: *secret-paths
    patterns:
      - pattern-regex: \b(AKIA|ASIA|ABIA|ACCA)[0-9A-Z]{16}\b
      - pattern-not-regex: \b(AKIA|ASIA)[0-9A-Z]{0,12}EXAMPLE\b

  - id: aegiscode.javascript.hardcoded-secret.github-token
    languages: [generic]
    severity: ERROR
    message: >-
      A GitHub token is written in this file. It gives access to repositories and
      settings of the account that created it. Revoke it in GitHub settings and load
      tokens from the environment or a secrets manager.
    metadata:
      vulnerability_type: hardcoded-secret
      cwe: "CWE-798"
      owasp: ["A07:2021 - Identification and Authentication Failures", "A07:2025 - Authentication Failures"]
      aegiscode_severity: critical
      confidence: high
    paths: *secret-paths
    pattern-either:
      - pattern-regex: \b(ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{36}\b
      - pattern-regex: \bgithub_pat_[A-Za-z0-9]{22}_[A-Za-z0-9]{59}\b

  - id: aegiscode.javascript.hardcoded-secret.private-key-block
    languages: [generic]
    severity: ERROR
    message: >-
      A private key is stored in this file. Anyone with the file can impersonate the
      server or user the key belongs to. Remove it, generate a new key pair, and load
      keys from a secure location outside the repository.
    metadata:
      vulnerability_type: hardcoded-secret
      cwe: "CWE-798"
      owasp: ["A07:2021 - Identification and Authentication Failures", "A07:2025 - Authentication Failures"]
      aegiscode_severity: critical
      confidence: high
    paths: *secret-paths
    pattern-regex: -----BEGIN ((RSA|EC|DSA|OPENSSH|ENCRYPTED|PGP) )?PRIVATE KEY( BLOCK)?-----

  - id: aegiscode.javascript.hardcoded-secret.provider-token
    languages: [generic]
    severity: ERROR
    message: >-
      An API token for a third-party service (Stripe, Slack, Google, npm or SendGrid)
      is written in this file. It can be used to act on your account and may cost
      money. Revoke it with the provider and load it from the environment instead.
    metadata:
      vulnerability_type: hardcoded-secret
      cwe: "CWE-798"
      owasp: ["A07:2021 - Identification and Authentication Failures", "A07:2025 - Authentication Failures"]
      aegiscode_severity: high
      confidence: high
    paths: *secret-paths
    pattern-either:
      - pattern-regex: \b(sk|rk)_live_[0-9A-Za-z]{24,}\b
      - pattern-regex: \bxox[abprs]-[0-9A-Za-z-]{10,}\b
      - pattern-regex: https://hooks\.slack\.com/services/T[0-9A-Z]+/B[0-9A-Z]+/[0-9A-Za-z]+
      - pattern-regex: \bAIza[0-9A-Za-z_-]{35}\b
      - pattern-regex: \bnpm_[A-Za-z0-9]{36}\b
      - pattern-regex: \bSG\.[A-Za-z0-9_-]{22}\.[A-Za-z0-9_-]{43}\b
